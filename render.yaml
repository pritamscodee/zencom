# Render Blueprint — New → Blueprint → pick this repo.
# Secrets marked `sync: false` are prompted for in the Render dashboard on first deploy.
services:
  - type: web
    name: zencom-api
    runtime: node # Render's native runtime supports Bun (detected from bun.lock)
    rootDir: backend
    buildCommand: bun install --frozen-lockfile # postinstall runs `prisma generate`
    startCommand: bun run db:deploy && bun run start
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BUN_VERSION
        value: 1.3.6
      - key: BACKEND_URL # e.g. https://zencom.onrender.com (or your custom domain)
        sync: false
      - key: FRONTEND_URL # e.g. https://frontend-pi-six-p4ny06tzkb.vercel.app
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY # 64 hex chars: openssl rand -hex 32
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      # Render's disk is ephemeral — configure R2 so uploaded documents persist.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: zencom-documents
      - key: TRIGGER_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_STARTER
        sync: false
      - key: RAZORPAY_PLAN_GROWTH
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: LINEAR_CLIENT_ID
        sync: false
      - key: LINEAR_CLIENT_SECRET
        sync: false
